[mod-name]
BlueprintBookShelf=Полка книг чертежей

[mod-description]
BlueprintBookShelf=Возьмите чертёж или книгу, наведите курсор на целевую книгу в панели и нажмите Shift. Открытие панели: Ctrl+Shift+B или кнопка с книгой.

[controls]
bbs-toggle=Открыть/закрыть полку книг чертежей
bbs-insert=Переместить чертёж/книгу в книгу под курсором на полке

[bbs]
title=Книги чертежей
toggle-tooltip=Полка книг чертежей (__CONTROL__bbs-toggle__)
help=Возьмите чертёж или книгу, наведите курсор на книгу ниже и нажмите __CONTROL__bbs-insert__.
search-tooltip=Поиск по названию и пути к книге. Латиница — без учёта регистра; кириллица — с учётом.
refresh=Обновить
total=Показано: __1__ / __2__ книг
empty=В инвентаре нет книг. Поместите книгу чертежей в инвентарь, чтобы использовать панель.
no-matches=Подходящих книг нет. Очистите поиск, чтобы увидеть все книги.
unnamed-book=Книга без названия
book-tooltip=__1__\nПредметов непосредственно внутри: __2__\nНажмите __CONTROL__bbs-insert__, чтобы переместить сюда чертёж/книгу из руки.
ready=Книги из инвентаря, включая вложенные. Панель можно перетащить за заголовок.
inserted=Перемещено в книгу: __1__
invalid-target=Этой книги больше нет в вашем инвентаре. Выберите книгу в обновлённом списке.
library-cursor=В руке ссылка на библиотеку чертежей. Сначала поместите копию в инвентарь и возьмите этот предмет.
empty-hand=Сначала возьмите в руку чертёж или книгу чертежей.
unsupported-item=Этой клавишей можно переносить только чертежи и книги чертежей.
recursive-book=Нельзя поместить книгу внутрь самой себя или одной из вложенных в неё книг.
book-full=В целевой книге нет свободных ячеек.
transfer-failed=Игра отклонила перенос. Предмет в руке не удалён.
