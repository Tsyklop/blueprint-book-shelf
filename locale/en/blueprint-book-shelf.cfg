[mod-name]
BlueprintBookShelf=Blueprint Book Shelf

[mod-description]
BlueprintBookShelf=Hold a blueprint or book, hover over a destination book in the shelf panel and press Shift to move it inside. Open the panel with Ctrl+Shift+B or the book button.

[controls]
bbs-toggle=Open/close the blueprint book shelf
bbs-insert=Move held blueprint/book into the hovered shelf book

[bbs]
title=Blueprint books
toggle-tooltip=Blueprint book shelf (__CONTROL__bbs-toggle__)
help=Hold a blueprint or book, hover over a book below and press __CONTROL__bbs-insert__.
search-tooltip=Filter by book name or parent path. Latin text is case-insensitive; other text uses exact case.
refresh=Refresh
total=Shown: __1__ / __2__ books
empty=No books in your inventory. Put a blueprint book in your inventory to use this panel.
no-matches=No books match this search. Clear the search to see all books.
unnamed-book=Unnamed book
book-tooltip=__1__\nItems directly inside: __2__\nPress __CONTROL__bbs-insert__ to move the held blueprint/book here.
ready=Inventory books, including nested books. Drag the title bar to move this panel.
inserted=Moved into: __1__
invalid-target=This book is no longer in your inventory. Choose a book from the refreshed list.
library-cursor=This is a blueprint-library reference. Put a copy in your inventory and pick up that item first.
empty-hand=Pick up a blueprint or a blueprint book first.
unsupported-item=Only blueprints and blueprint books can be moved with this shortcut.
recursive-book=A book cannot be placed inside itself or one of its nested books.
book-full=The target book has no empty slots.
transfer-failed=The game rejected the transfer. The held item has not been removed.
